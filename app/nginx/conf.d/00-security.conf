# Shared, http-context directives. Loaded before the server blocks (00- prefix).
#
# Section 201. The droplet fronts a public site now, so nginx is the first
# line: request-rate limits per client IP, a connection cap, no version banner.
# UFW covers the ports; DigitalOcean absorbs volumetric floods at the network
# edge; what is left for us is the slow, targeted kind, which is what these
# limits are for. The login endpoint gets its own tight zone because a
# password guesser needs many attempts and a real person needs five.

server_tokens off;

limit_req_zone  $binary_remote_addr zone=site:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
limit_req_zone  $binary_remote_addr zone=chat:10m   rate=20r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
