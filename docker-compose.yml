services:
  pgdb:
    container_name: postgres_container
    # Build CrunchyData-based Postgres with pgvector compiled-in
    build:
      context: ./docker/postgres-crunchy-pgvector
    # if you prefer a prebuilt image, you can replace `build:` with:
    # image: crunchydata/crunchy-postgres:15.3
    restart: always
    env_file:
      - .env
    ports:
     # 127.0.0.1 ONLY. Docker writes its own iptables rules and BYPASSES ufw,
     # so a plain "5432:5432" published this database to the whole internet
     # even though ufw allowed only 22, 80, 443 and 8000 -- confirmed on
     # 2026-08-23 by connecting to the droplet's public IP on 5432 from
     # outside. The firewall looked correct and was not being consulted.
     #
     # Nothing needs the public binding: the app reaches pgdb:5432 over the
     # compose network. For a DB client on a laptop, tunnel instead:
     #     ssh -L 5432:localhost:5432 root@<droplet>
     - "127.0.0.1:5432:5432"
    volumes:
     - postgres-data:/var/lib/postgresql/data
     - ./docker/postgres-crunchy-pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    env_file:
      - .env
    ports:
      # Same reasoning as pgdb above: loopback only, reached through an SSH
      # tunnel. pgAdmin holds saved database credentials, so exposing it is
      # strictly worse than exposing Postgres itself.
      - 127.0.0.1:5050:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
     - pgdb
  app:
    container_name: app
    build: .
    command: bash -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - 8000:8000
    depends_on:
      pgdb:
        condition: service_healthy
    restart: always
  nginx:
    container_name: "nginx"
    restart: always
    image: nginx
    volumes:
      - ./app/nginx/conf.d:/etc/nginx/conf.d
    ports:
      - 80:80
    depends_on:
      - app
volumes:
 postgres-data:
 pgadmin-data:
