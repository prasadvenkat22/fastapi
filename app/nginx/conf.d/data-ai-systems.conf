# data-ai-systems.com — the Next.js site plus the FastAPI paths it calls,
# one origin. Section 201.
#
# HTTP only here. The HTTPS server block lives in data-ai-systems-ssl.conf and
# is written by scripts/issue_cert.sh AFTER Let's Encrypt has issued, because
# an ssl_certificate directive pointing at a file that does not exist stops
# nginx from starting at all. Until DNS points at this droplet the site is
# served on :80 and the ACME challenge path is ready.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name data-ai-systems.com www.data-ai-systems.com _;

    resolver 127.0.0.11 valid=10s;
    set $api http://app:8000;
    set $web http://data-ai-web:3000;

    limit_conn perip 30;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ---- API: same origin, no CORS needed ---------------------------------
    location = /auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /auth/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /trading/ {
        limit_req zone=api burst=20 nodelay;
        proxy_read_timeout 120s;      # a 12-name screen fetches 12 chains
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_read_timeout 180s;      # GenAI agents call the model twice
        client_max_body_size 25m;     # PDF/CSV uploads
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location ~ ^/CRUD/[^/]+$ {
        limit_req zone=api burst=20 nodelay;
        rewrite ^ $uri/ break;
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /CRUD/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /images/ {
        limit_req zone=api burst=10 nodelay;
        client_max_body_size 5m;
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /static/     { proxy_pass $api; include /etc/nginx/conf.d/proxy_params.inc; }
    location /FileUploads/ { limit_req zone=api burst=10 nodelay; proxy_pass $api; include /etc/nginx/conf.d/proxy_params.inc; }
    # The API's own schema browser is not published. It described every
    # route to anyone who asked (2026-09-19). Read it over an SSH tunnel to the
    # loopback port instead:  ssh -L 8000:127.0.0.1:8000 root@<droplet>  then
    # http://localhost:8000/docs
    location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }

    # ---- the site ---------------------------------------------------------
    location /_next/static/ {
        proxy_pass $web;
        include /etc/nginx/conf.d/proxy_params.inc;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        limit_req zone=site burst=60 nodelay;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
