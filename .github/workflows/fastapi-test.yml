name: CI - Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_atlas:
        description: 'Set to "true" to attempt running tests against Atlas (requires ATLAS_URI secret)'
        required: true
        default: 'false'
 

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017']
        # Use mongosh for the healthcheck because the legacy `mongo` shell
        # may not be present in newer Mongo images (MongoDB 6+). If the
        # runner still fails, the healthcheck can be removed entirely.
        options: >-
          --health-cmd="mongosh --eval \"db.adminCommand({ ping: 1 })\" --quiet || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure dnspython is available for mongodb+srv SRV resolution (Atlas)
          pip install dnspython pytest pytest-asyncio

      # Removed conditional wait step because accessing `secrets` in
      # that expression caused evaluation errors in some contexts.
      # The test runner will perform any necessary checks at runtime.

      - name: Run tests
        env:
          # If ATLAS_URI secret is set, tests may run against Atlas when requested.
          ATLAS_URI: ${{ secrets.ATLAS_URI }}
          # Workflow dispatch input: set to 'true' to attempt Atlas run
          RUN_ATLAS: ${{ github.event.inputs.run_atlas }}
          # Provide a default SQL DATABASE URL for CI so SQLAlchemy doesn't fail
          # when Postgres isn't available in the runner. Use a local SQLite file.
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: |
          # Decide whether to run against Atlas.
          if [ "${RUN_ATLAS}" = "true" ] && [ -n "${ATLAS_URI}" ]; then
            echo "Attempting to validate ATLAS_URI DNS before running tests against Atlas"
            # Extract host portion from mongodb+srv://<user>:<pass>@host[:port]/...
            ATLAS_HOST=$(python - <<'PY'
import sys,urllib.parse
u = sys.argv[1]
u = u.strip()
if u.startswith('mongodb+srv://'):
    # strip prefix
    no_pref = u.split('://',1)[1]
    # split at first / to remove any trailing path
    hostpart = no_pref.split('/',1)[0]
    # if credentials present, split at '@'
    if '@' in hostpart:
        hostpart = hostpart.split('@',1)[1]
    print(hostpart)
else:
    print('')
PY
"${ATLAS_URI}")
            echo "Resolved ATLAS host: ${ATLAS_HOST}"
            if [ -z "${ATLAS_HOST}" ]; then
              echo "Could not parse ATLAS host from ATLAS_URI; falling back to local Mongo"
              USE_ATLAS=false
            else
              # Try DNS resolution (may fail in restricted networks)
              python - <<'PY'
import sys,socket
host = sys.argv[1]
try:
    socket.getaddrinfo(host, None)
    sys.exit(0)
except Exception as e:
    sys.exit(2)
PY
              if [ $? -eq 0 ]; then
                export MONGODB_URL="${ATLAS_URI}"
                echo "Using ATLAS_URI for tests"
              else
                echo "ATLAS host DNS resolution failed; falling back to local Mongo"
                export MONGODB_URL="mongodb://localhost:27017"
                USE_ATLAS=false
              fi
            fi
          else
            export MONGODB_URL="mongodb://localhost:27017"
            echo "Using local MongoDB service for tests"
          fi

          # If using local Mongo, wait for it to be ready
          if [[ "${MONGODB_URL}" == mongodb://* ]]; then
            echo "Waiting for local MongoDB to become available..."
            for i in {1..60}; do
              nc -z localhost 27017 && echo "Mongo is up" && break || sleep 1
            done
            if ! nc -z localhost 27017; then
              echo "Timed out waiting for MongoDB on localhost:27017" >&2
              exit 1
            fi
          fi

          python -m pytest -q
