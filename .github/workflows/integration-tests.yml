name: CI - Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongo --eval 'db.runCommand({ ping: 1 })' --quiet || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure dnspython is available for mongodb+srv SRV resolution (Atlas)
          pip install dnspython pytest pytest-asyncio

      - name: Wait for local Mongo (skipped if ATLAS_URI provided)
        if: ${{ secrets.ATLAS_URI == '' }}
        run: |
          for i in {1..30}; do
            nc -z localhost 27017 && break || sleep 1
          done

      - name: Run tests
        env:
          # If ATLAS_URI secret is set, tests will run against Atlas. Otherwise use local test Mongo.
          ATLAS_URI: ${{ secrets.ATLAS_URI }}
        run: |
          # Choose Mongo URL: prefer ATLAS_URI when provided
          if [ -n "$ATLAS_URI" ]; then
            export MONGODB_URL="$ATLAS_URI"
            echo "Using ATLAS_URI for tests"
          else
            export MONGODB_URL="mongodb://localhost:27017"
            echo "Using local MongoDB service for tests"
          fi
          python -m pytest -q
