# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Optimized for Digital Ocean Basic Droplet ($12/mo - 2GB RAM, 1 vCPU)
# Memory allocation:
#   - PostgreSQL: 384MB
#   - MongoDB: 256MB
#   - FastAPI: 512MB
#   - Streamlit: 384MB
#   - Nginx: 64MB
#   - Total: ~1.6GB (leaves ~400MB for OS)

services:
  mongo:
    deploy:
      resources:
        limits:
          memory: 256M
    # Limit WiredTiger cache to 256MB
    command: mongod --wiredTigerCacheSizeGB 0.25
    restart: always

  pgdb:
    # Override env_file to use production config
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      - POSTGRES_SHARED_BUFFERS=128MB
      - POSTGRES_WORK_MEM=4MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=256MB
    restart: always

  app:
    # Override env_file to use production config
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          memory: 512M
    # Remove --reload flag for production
    command: bash -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"
    # Don't mount local volumes in production
    volumes: []
    restart: always

  streamlit:
    # Override env_file to use production config
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          memory: 384M
    # Don't mount local volumes in production
    volumes: []
    restart: always

  nginx:
    deploy:
      resources:
        limits:
          memory: 64M
    restart: always

  # Disable pgAdmin in production to save ~200MB RAM
  # To enable for debugging, run with: --profile debug
  pgadmin:
    env_file:
      - .env.production
    profiles:
      - debug
